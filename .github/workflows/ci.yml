name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: tollgate
          POSTGRES_PASSWORD: tollgate
          POSTGRES_DB: tollgate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tollgate -d tollgate"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://tollgate:tollgate@localhost:5432/tollgate
      REDIS_URL: redis://localhost:6379
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Apply migrations
        run: pnpm db:deploy

      # Fails (exit 2) if the migrations and schema.prisma disagree, e.g. a hand-written index
      # that the next `migrate dev` would drop.
      - name: Check schema drift
        run: pnpm prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

      - name: Integration tests
        run: pnpm test:int
        env:
          CI: "true"
          TEST_DATABASE_URL: postgresql://tollgate:tollgate@localhost:5432/tollgate
          TEST_REDIS_URL: redis://localhost:6379

      # Build with sentinel secret values, then look for those values in the client bundle.
      # Matching values, not variable names: libraries (e.g. Better Auth's env helper) ship
      # names like AUTH_SECRET in browser code without ever reading a value there.
      - name: Build
        run: pnpm build
        env:
          NODE_ENV: production
          AUTH_SECRET: ci-sentinel-auth-secret-7f3a9c2e5b8d1f40
          AUTH_GOOGLE_ID: ci-sentinel-google-id-61c8e2
          AUTH_GOOGLE_SECRET: ci-sentinel-google-secret-4d9b7a
          AUTH_GITHUB_ID: ci-sentinel-github-id-0b2d4f
          AUTH_GITHUB_SECRET: ci-sentinel-github-secret-9e1c7a
          EMAIL_API_KEY: ci-sentinel-email-key-2e7f5c
          EMAIL_FROM: sentinel@ci.invalid
          NEXCONN_APP_KEY: ci-sentinel-nexconn-key-8a1d3f
          NEXCONN_APP_SECRET: ci-sentinel-nexconn-secret-5c0e9b
          AI_API_KEY: ci-sentinel-ai-key-3b6f1e

      # Covers the browser bundle and the prerendered HTML/RSC shells served to every visitor.
      # Request-time (dynamic) output is out of scope for a build-time scan.
      - name: Scan client output for secrets
        run: |
          pattern='ci-sentinel-(auth-secret|google-secret|github-secret|email-key|nexconn-secret|ai-key)|tollgate:tollgate@|postgres(ql)?://|rediss?://'
          leaks=$( { grep -rlE "$pattern" .next/static; find .next/server/app -type f \( -name '*.html' -o -name '*.rsc' -o -name '*.body' -o -name '*.meta' \) -exec grep -lE "$pattern" {} +; } || true )
          if [ -n "$leaks" ]; then
            echo "$leaks"
            echo "::error::Server-only values found in client output"
            exit 1
          fi
          echo "No server-only values in client output"
